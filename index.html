<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オンライン対戦 〇×ゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="home-screen">
            <h1>🎮 オンライン 〇×ゲーム</h1>
            <p id="role-display">接続中...</p>
            <div class="menu-buttons">
                <button id="btn-3x3" class="menu-btn">
                    <span class="btn-title">3 × 3</span>
                    <span class="btn-desc">基本モード</span>
                </button>
                <button id="btn-4x4" class="menu-btn">
                    <span class="btn-title">4 × 4</span>
                    <span class="btn-desc">難易度アップ</span>
                </button>
            </div>
        </div>

        <div id="game-screen" style="display: none;">
            <h2 id="game-title"></h2>
            <div id="message"></div>
            <div id="board" class="board"></div>
            <button id="back-button">🏠 ホームに戻る</button>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
